<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Raffelsperger (1850) – interaktivní mapa</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #f4f2ef; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    #viewer { position: absolute; inset: 0; width: 100%; height: 100%; }
    .controls {
      position: absolute; right: 16px; bottom: 16px; z-index: 5;
      display: flex; gap: 6px; padding: 5px;
      background: rgba(255,255,255,.96); border: 1px solid #d4d4d4;
      border-radius: 9px; box-shadow: 0 2px 10px #0002;
    }
    .controls button {
      width: 38px; height: 38px; padding: 0; border: 0; border-radius: 6px;
      background: transparent; color: #242424; cursor: pointer;
      font: 600 23px/1 system-ui, sans-serif;
    }
    .controls button:hover, .controls button:focus-visible { background: #ededed; outline-offset: 2px; }
    .controls button.home { font-size: 19px; }
    .credit {
      position: absolute; bottom: 16px; left: 16px; z-index: 5;
      border-radius: 5px; background: rgba(255,255,255,.87);
      padding: 6px 9px; font-size: 11px; color: #444;
    }
    .credit a { color: inherit; text-underline-offset: 2px; }
    .status {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      z-index: 4; max-width: min(90vw,520px); padding: 14px 18px;
      border-radius: 8px; background: rgba(255,255,255,.94);
      box-shadow: 0 2px 15px #0002; color: #333;
      font-size: 14px; line-height: 1.5; text-align: center;
    }
    .status[hidden] { display: none; }
    .status a { color: #0757a1; }
    @media (max-width: 520px) {
      .controls { right: 9px; bottom: 9px; }
      .credit { left: 9px; bottom: 9px; padding: 4px 6px; max-width: 55%; }
      .controls button { width: 34px; height: 34px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/openseadragon@6.1.1/build/openseadragon/openseadragon.min.js"></script>
</head>
<body>
  <main id="viewer" aria-label="Interaktivní prohlížeč historické mapy"></main>
  <div class="status" id="status" role="status">Načítám mapu…</div>
  <div class="controls" aria-label="Ovládání mapy">
    <button type="button" id="zoomIn" aria-label="Přiblížit" title="Přiblížit">+</button>
    <button type="button" id="zoomOut" aria-label="Oddálit" title="Oddálit">−</button>
    <button type="button" class="home" id="home" aria-label="Zobrazit celou mapu" title="Zobrazit celou mapu">⌂</button>
  </div>
  <div class="credit">
    Zdroj: <a href="https://www.digitalniknihovna.cz/cuni/view/uuid:ba16e732-43a2-11ec-9a05-fa163e4ea95f?page=uuid:bba447ca-43a2-11ec-9a05-fa163e4ea95f" target="_blank" rel="noopener noreferrer">Digitální knihovna UK</a>
  </div>

  <script>
    // Konkrétní sken (parametr page z původní URL); ne UUID nadřazeného záznamu.
    // IIIF Image API: informace o snímku. OpenSeadragon si z nich vytvoří dlaždice pro zoom.
    const iiifInfoUrl = 'https://kramerius.cuni.cz/search/iiif/uuid:bba447ca-43a2-11ec-9a05-fa163e4ea95f/info.json';
    const sourceUrl = 'https://www.digitalniknihovna.cz/cuni/view/uuid:ba16e732-43a2-11ec-9a05-fa163e4ea95f?page=uuid:bba447ca-43a2-11ec-9a05-fa163e4ea95f';
    const status = document.getElementById('status');

    if (!window.OpenSeadragon) {
      status.innerHTML = 'Nepodařilo se načíst prohlížeč OpenSeadragon. Zkontrolujte internetové připojení.';
    } else {
      const viewer = OpenSeadragon({
        id: 'viewer',
        tileSources: iiifInfoUrl,
        showNavigationControl: false,
        showNavigator: false,
        animationTime: 0.65,
        blendTime: 0.1,
        visibilityRatio: 0.8,
        constrainDuringPan: true,
        minZoomImageRatio: 0.8,
        maxZoomPixelRatio: 4,
        homeFillsViewer: false,
        gestureSettingsMouse: {
          scrollToZoom: true,
          clickToZoom: false,
          dblClickToZoom: true,
          dragToPan: true
        },
        gestureSettingsTouch: {
          pinchToZoom: true,
          dragToPan: true,
          flickEnabled: true,
          dblClickToZoom: true
        }
      });

      viewer.addHandler('open', () => { status.hidden = true; });
      viewer.addHandler('open-failed', (event) => {
        console.error('IIIF se nepodařilo otevřít:', event);
        status.innerHTML =
          'Mapu se nepodařilo načíst z IIIF služby knihovny. ' +
          'Ověřte dostupnost <a target="_blank" rel="noopener" href="' + iiifInfoUrl + '">IIIF info.json</a> ' +
          'nebo otevřete <a target="_blank" rel="noopener" href="' + sourceUrl + '">originální mapu</a>. ' +
          'Příčinou může být také omezení CORS na straně knihovny.';
        status.hidden = false;
      });

      function operate(action) {
        if (!viewer.viewport || !viewer.world.getItemCount()) return;
        action();
        viewer.viewport.applyConstraints();
      }
      document.getElementById('zoomIn').addEventListener('click', () => operate(() => viewer.viewport.zoomBy(1.6)));
      document.getElementById('zoomOut').addEventListener('click', () => operate(() => viewer.viewport.zoomBy(1 / 1.6)));
      document.getElementById('home').addEventListener('click', () => operate(() => viewer.viewport.goHome()));
    }
  </script>
</body>
</html>
